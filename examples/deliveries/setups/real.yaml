# Everything real: your mailbox (read only), the LLM server on this machine, and Google Calendar.
# `timezone` and `calendar_name` are yours. The mail login is in the environment (`source private/env.sh`); the Google
# sign-in is the two files the client names, in private/, which git ignores.
note: "Real: the mailbox (read only), the LLM on this machine, and Google Calendar: the calendar named in this setup, which this system creates."
tools:
  MAILBOX:         {client: {kind: imap, days: 21, max_messages: 300, authenticated_only: true, timezone: America/New_York}, facts: {LEAVES_NETWORK: true,  adds: [UNTRUSTED, PERSONAL]}}
  LOCAL_LLM:       {client: {endpoint: ../../configs/llm/local.yaml, prompts: prompts.yaml}, facts: {OUTPUT: false, LEAVES_NETWORK: false, adds: [UNTRUSTED, LLM_WRITTEN]}}
  GOOGLE_CALENDAR: {client: {kind: google_calendar, client_secret: ../../private/google_client_secret.json, token: ../../private/google_token.json,
                             calendar_name: "Deliveries (agent)", timezone: America/New_York, mark: deliveries_test, file: google_deliveries},
                    facts: {OUTPUT: true,  LEAVES_NETWORK: true,  adds: []}}
  SENDERS_FILE:    {client: {kind: text_file, file: senders.txt}, facts: {OUTPUT: false, LEAVES_NETWORK: false, adds: []}}
  CLOCK:           {client: {kind: clock, timezone: America/New_York}, facts: {OUTPUT: false, LEAVES_NETWORK: false, adds: []}}
  BROWSER:         {client: {kind: web},                                    facts: {OUTPUT: true,  LEAVES_NETWORK: false, adds: []}}
modules:
  mail.read.*:            {tool: MAILBOX, facts: {OUTPUT: false}}   # reads only
  mail.send.*:            {tool: MAILBOX, facts: {OUTPUT: true}}    # none written: modules/mail_send.py
  calendar.*:             {tool: GOOGLE_CALENDAR}
  file.monitored_senders: {tool: SENDERS_FILE}
  llm.*:                  {tool: LOCAL_LLM}
  clock.*:                {tool: CLOCK}
  user.*:                 {tool: BROWSER}   # what is typed in the chat (user.describe) carries no label: a judgment that it holds no personal data
  user.enter_senders:     {tool: BROWSER, facts: {adds: [PERSONAL]}}
log: {tool: BROWSER, facts: {DESTRUCTIVE: false}}   # the page displays what a module wrote in an error: a call of `log`, checked like a call of a module that uses this tool
