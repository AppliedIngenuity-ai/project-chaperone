[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "project-chaperone"
version = "0.1.0"
description = "A rule-enforcing harness for workflows: possible violations reported before a run, forbidden calls refused while it runs."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Applied Ingenuity LLC" }]
dependencies = [
    "PyYAML>=6.0",            # the configuration files
    "beautifulsoup4>=4.12",   # mail written in HTML, read as text
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["chaperone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
